name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: haxe ${{ matrix.haxe-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        haxe-version:
          - 4.3.7
          # - 5.0.0-preview.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: lix-pm/setup-lix@1.0.0
        with:
          lix-version: 17.0.0

      - name: lix download
        run: lix download

      - name: Run unit tests
        run: haxe tests.hxml && node tests-out/RunTests.js

      # Rebuilding through our own installed shim (scoped resolution, matrix
      # Haxe version) is the real end-to-end validation that haxeshim works
      # on itself.
      - name: Smoke test - rebuild via our own shim
        run: haxe all.hxml

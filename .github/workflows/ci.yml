name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: haxe ${{ matrix.haxe-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        haxe-version:
          - stable
          - 5.0.0-preview.1
          - nightly
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install Lix
        uses: lix-pm/setup-lix@master

      - name: lix download
        run: lix download

      - name: Run unit tests
        run: npm run test

      - name: Build Shims
        run: npm run build

      - name: E2E tests
        env:
          FORCE_COLOR: 1
        run: node tests/e2e/run.mjs --haxe-version ${{ matrix.haxe-version }} --verbose

      # Windows CreateProcess finds stock haxelib.exe next to haxe.exe before PATH,
      # so scoped `haxelib path hxcpp` fails during gencpp. Expect this step to fail
      # until version-dir haxelib.exe is wrapped with the haxeshim exify shim.
      - name: Windows sibling-haxelib repro
        if: runner.os == 'Windows'
        env:
          FORCE_COLOR: 1
        run: node tests/e2e/windows-sibling-haxelib.mjs --haxe-version ${{ matrix.haxe-version }}

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: haxe ${{ matrix.haxe-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        haxe-version:
          - 4.3.7
          # - 5.0.0-preview.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install lix
        run: npm install -g lix@17.0.0

      - name: lix download
        run: lix download

      - name: Run unit tests
        run: haxe tests.hxml && node tests-out/RunTests.js

      - name: Build Shims
        run: haxe all.hxml

      - name: E2E tests
        run: node tests/e2e/run.mjs
        env:
          HAXE_VERSION: ${{ matrix.haxe-version }}

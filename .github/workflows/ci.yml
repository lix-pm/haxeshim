name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: haxe ${{ matrix.haxe-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        haxe-version:
          - stable
          - 5.0.0-preview.1
          - nightly
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install lix
        run: npm install -g lix@17.0.0

      - name: lix download
        run: lix download

      - name: Run unit tests
        run: npm run test

      - name: Build Shims
        run: npm run build

      - name: E2E tests
        env:
          FORCE_COLOR: 1
        run: node tests/e2e/run.mjs --haxe-version ${{ matrix.haxe-version }} --verbose
